# Render's free plan sleeps the API after ~15 min idle, and the first visit
# after that waits 30–60s for it to wake (showing fallback copy meanwhile).
# Pinging every 10 min keeps it warm. Lives in this public repo because
# public-repo Actions minutes are free; /api/health doesn't touch the DB,
# so Neon still auto-suspends.
#
# Note: GitHub disables scheduled workflows after 60 days with no commits
# to the repo — re-enable from the Actions tab if that happens.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            https://amberbroihier-api.onrender.com/api/health
