<html lang="en">

    <meta name="description" content="Amber Broihier — facilitator, speaker and entrepreneur. Workshops, speaking and retreats on self-love, because how we show up for ourselves shapes how we show up everywhere else." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Retreats · Amber Broihier</title>
    <!-- Link previews (iMessage, LinkedIn, Facebook, Slack…). The build writes
         a copy of this file per route with its own title and URL — see
         routePages() in vite.config.js. -->
    <link rel="canonical" href="https://amberbroihier.com/retreats" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amber Broihier" />
    <meta property="og:title" content="Retreats · Amber Broihier" />
    <meta property="og:description" content="Facilitator, speaker and entrepreneur. Workshops, speaking and retreats on self-love." />
    <meta property="og:url" content="https://amberbroihier.com/retreats" />
    <meta property="og:image" content="https://amberbroihier.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Amber Broihier smiling, lying on a studio floor" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The page can't render its real copy until GET /api/content returns, and
         that's a different origin — so pay the DNS + TLS cost now, in parallel
         with the bundle, instead of after it. Vite substitutes the env value at
         build time. -->
    <link rel="preconnect" href="https://amberbroihier-api.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://amberbroihier-api.onrender.com" />
    <!-- Amber's theme picks Google-hosted fonts; warm that connection too. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // https://github.com/rafgraph/spa-github-pages
      // Decodes a redirect from 404.html into a real client-side route.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
